name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android checks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          test -x "$sdkmanager_bin"
          set +o pipefail
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          set -o pipefail
          "$sdkmanager_bin" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-cleanup: on-success

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build cached OpenSSH test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: scripts/ssh-test.Dockerfile
          tags: codexdeck-ssh-test:ci
          load: true
          cache-from: type=gha,scope=codexdeck-ssh-test-v1
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=codexdeck-ssh-test-v1' || '' }}

      - name: Run real SSH and ProxyJump integration test
        env:
          SSH_TEST_DOCKER_IMAGE: codexdeck-ssh-test:ci
          SSH_TEST_DEBUG: "1"
        run: |
          python3 scripts/ssh_test_server.py -- \
            ./gradlew :app:testDebugUnitTest \
              --tests 'cc.cherr.codexdeck.SshConnectionIntegrationTest' \
              --stacktrace

      - name: Test and lint
        run: |
          ./gradlew \
            :protocol:test \
            :app:testDebugUnitTest \
            :terminal-emulator:testDebugUnitTest \
            :terminal-view:testDebugUnitTest \
            :app:lintDebug \
            --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify installable debug APK
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          apksigner="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$apksigner" verify --verbose "$apk"
          aapt2="$(find "${ANDROID_HOME}/build-tools" -name aapt2 -type f | sort -V | tail -n 1)"
          "$aapt2" dump badging "$apk" | grep -q "package: name='cc.cherr.codexdeck.debug'"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: codexdeck-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
